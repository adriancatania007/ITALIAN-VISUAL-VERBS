
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La vita scolastica | Dizionario visivo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f8fe;color:#173250}
header{background:linear-gradient(120deg,#173b74,#246baf);color:white;padding:28px 20px;text-align:center}
header a{color:white;display:inline-block;margin-bottom:12px}
h1{font-size:36px;margin:12px 0}
header p{font-size:17px}
main{max-width:1150px;margin:auto;padding:25px 18px}
.intro{text-align:center;font-size:18px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:white;border:1px solid #dce6f4;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #173b7414}
.card img{width:100%;height:215px;object-fit:cover;display:block}
.content{padding:18px}
h2{color:#173b74;margin:0 0 8px;font-size:24px}
.meaning{font-size:17px;font-weight:bold;color:#46617e;margin:0 0 12px}
.example{background:#edf4fc;border-radius:10px;padding:12px;margin:0 0 16px;font-size:17px}
.btn{display:inline-block;background:#18538f;color:white;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:bold}
.btn:hover{background:#2672b5}
footer{text-align:center;padding:24px;color:#60738b}
</style>
</head>
<body>
<header>
<a href="index.html">← Tutti gli argomenti</a>
<h1>📚 La vita scolastica</h1>
<p>Guarda le fotografie, impara i verbi e prova a coniugarli!</p>
</header>

<main>
<p class="intro">10 verbi in ordine alfabetico · Livello A1–A2</p>
<section class="grid" id="cards"></section>
</main>

<footer>Dizionario visivo dei verbi italiani</footer>

<script>
const verbs=[
["ascoltare","to listen","Gli studenti ascoltano la professoressa."],
["chiedere","to ask","Marco chiede una spiegazione."],
["entrare","to enter","Gli studenti entrano in classe."],
["imparare","to learn","Giulia impara nuove parole italiane."],
["leggere","to read","Luca legge un libro interessante."],
["parlare","to speak","I ragazzi parlano durante la pausa."],
["rispondere","to answer","Sara risponde alla domanda."],
["scrivere","to write","Marco scrive sul quaderno."],
["studiare","to study","Paolo studia per l'esame."],
["uscire","to go out","Gli studenti escono da scuola."]
];

const container=document.getElementById("cards");
for(const [verb,meaning,example] of verbs){
 const card=document.createElement("article");
 card.className="card";

 const img=document.createElement("img");
 img.src="vita_scolastica_images/"+verb+".jpg";
 img.alt="Fotografia: "+verb;
 img.loading="lazy";

 const content=document.createElement("div");
 content.className="content";

 const h=document.createElement("h2");
 h.textContent=verb.toUpperCase();

 const m=document.createElement("p");
 m.className="meaning";
 m.textContent=meaning;

 const ex=document.createElement("p");
 ex.className="example";
 ex.textContent=example;

 const a=document.createElement("a");
 a.className="btn";
 a.href="https://adriancatania007.github.io/Italian-verb-player/?verb="+encodeURIComponent(verb);
 a.target="_blank";
 a.rel="noopener";
 a.textContent="Coniuga il verbo ↗";

 content.append(h,m,ex,a);
 card.append(img,content);
 container.append(card);
}
</script>
</body>
</html>
